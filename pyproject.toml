[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gzcmd-record-linkage"
version = "0.2.0"
description = "Deterministic policy engine for clerical review linkage decision support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
authors = [{ name = "Marco Jardim" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "requests>=2.31",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyright>=1.1",
]

[project.scripts]
gzcmd = "gzcmd_record_linkage.cli:main"

[project.urls]
Homepage = "https://github.com/marco-jardim/gzcmd-record-linkage"
Source = "https://github.com/marco-jardim/gzcmd-record-linkage"

[tool.hatch.build.targets.wheel]
packages = ["src/gzcmd_record_linkage"]
include = [
  "src/gzcmd_record_linkage/gzcmd_v3_config.yaml",
  "src/gzcmd_record_linkage/gzcmd_v3_llm_prompt.md",
  "src/gzcmd_record_linkage/gzcmd_v3_llm_output.schema.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/gzcmd_record_linkage/**",
  "README.md",
  "requirements/**",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# O .ipynb é um artefato GERADO por notebooks/build_notebook.py (este sim, lintado).
# A escala de QA de lint do projeto cobre notebooks/*.py e tests/* (não o .ipynb,
# cujo texto markdown PT-BR e imports up-front são didáticos). A corretude do código
# do notebook é garantida pela execução headless ponta-a-ponta (TST*.NBEXEC).
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# build_notebook.py carrega o texto markdown (PT-BR) do notebook como strings
# literais; tabelas e parágrafos não podem ser quebrados sem corromper o render.
"notebooks/build_notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DEC-01: notebooks/ on pythonpath so tests can import synthetic_data / nb_helpers
# (presentation artifacts stay OUT of src/ per D7; not shipped in the wheel).
pythonpath = ["src", "notebooks"]
addopts = "-q"
markers = [
  "notebook: testes que executam o notebook (headless via nbclient); mais lentos",
]

[tool.coverage.run]
branch = true
source = ["gzcmd_record_linkage"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 0
